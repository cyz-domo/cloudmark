<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save and access your bookmarks from anywhere with Cloudmark"
    />
    <meta name="theme-color" content="#5b4df5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon2.png" />
    <title>Cloudmark - Your Universal Bookmark Manager</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cloudmark - Your Universal Bookmark Manager" />
    <meta
      property="og:description"
      content="Save and access your bookmarks from anywhere with Cloudmark"
    />
    <meta property="og:image" content="/og-image-en.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme FOUC before React mounts -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cloudmark:theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          else root.classList.remove("dark");
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
